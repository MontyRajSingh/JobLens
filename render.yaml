services:
  - type: web
    name: joblens-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: joblens-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: MODEL_DIR
        value: /app/pipeline/models
      - key: DATA_DIR
        value: /app/output
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: CORS_ORIGINS
        value: "*"
      - key: SKIP_RESEED
        value: "false"
    healthCheckPath: /health

databases:
  - name: joblens-db
    plan: free
    region: oregon
    databaseName: joblens
    user: joblens
