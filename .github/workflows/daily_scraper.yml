name: Daily Job Scraper

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    # Fail fast at 5h instead of grinding into GitHub's 6h default cap.
    # The trimmed grid + city sharding should finish in ~3-4h; this is a
    # safety net so a flaky day still gets partial data committed.
    timeout-minutes: 300

    # Grant permission for the action to push changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install Scrapling browsers
        run: |
          scrapling install

      - name: Run JobLens Scraper
        env:
          # Session cookies for login-walled sources (see COOKIE_SOURCES in
          # config.py). Paste each site's request "Cookie:" header as the secret
          # value. If a secret is unset the scraper warns and returns nothing —
          # it never crashes the run.
          WELLFOUND_COOKIE: ${{ secrets.WELLFOUND_COOKIE }}
          NAUKRI_COOKIE: ${{ secrets.NAUKRI_COOKIE }}
          INSTAHYRE_COOKIE: ${{ secrets.INSTAHYRE_COOKIE }}
        run: |
          # Rotate cities across the days of the week so the full city
          # list is covered over 7 days while keeping each run small
          # enough to finish well within the timeout.
          SHARD=$(( $(date +%u) - 1 ))   # Mon=0 .. Sun=6
          echo "Running shard $SHARD of 7"
          python main.py \
            --sources levelsfyi payscale linkedin wellfound instahyre naukri \
            --shard "$SHARD" --total 7 \
            --max-jobs 5

      - name: Commit and Push new data
        # `always()` ensures partial data (appended incrementally to
        # jobs_master.csv during the run) is committed even if the
        # scrape step was cancelled or a source failed. The
        # diff-index check below still prevents empty commits.
        if: always()
        run: |
          # Configure git with a bot identity
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage the newly created CSV/JSON files in the output directory
          git add output/

          # Check if there are actually any changes to commit
          if git diff-index --quiet HEAD; then
            echo "No new data to commit. Exiting."
            exit 0
          fi

          git commit -m "Auto-scrape: Added daily job market data [skip ci]"

          # Safe push: the remote may have moved during the ~30-min run (a
          # manual push, or another workflow). The daily commit only APPENDS
          # rows to jobs_master.csv, so replaying it on top of the remote via
          # rebase is safe and non-conflicting. Retry a few times to survive a
          # race instead of silently dropping the night's data.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on latest main and retrying."
            git pull --rebase origin main
          done

          echo "::error title=Push failed::Could not push scraped data after 3 attempts."
          exit 1
