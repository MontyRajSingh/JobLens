services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-joblens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.gcp}
      POSTGRES_DB: ${POSTGRES_DB:-joblens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-joblens} -d ${POSTGRES_DB:-joblens}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-joblens}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-joblens}
      MODEL_DIR: /app/pipeline/models
      DATA_DIR: /app/output
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_KEYS: ${API_KEYS:-}
      SKIP_RESEED: ${SKIP_RESEED:-false}
    volumes:
      - ./output:/app/output
      - ./pipeline/models:/app/pipeline/models:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
